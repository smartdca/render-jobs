name: render
# stage 1: loop + warm-up frames (matrix), collect: join blocks, stage 2: final picture blocks (matrix), publish: join and push to branch "out"
on:
  workflow_dispatch:
    inputs:
      only: { description: "comma separated job ids to run in stage 1 (empty = all)", required: false, default: "" }
      final: { description: "run stage 2 + publish", required: false, default: "yes" }
      from_run: { description: "reuse stage-1 results of this run id (skips stage 1)", required: false, default: "" }
permissions:
  contents: write
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      s1: ${{ steps.m.outputs.s1 }}
      s2: ${{ steps.m.outputs.s2 }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          J = json.load(open('jobs.json')); only = [x for x in os.environ.get('ONLY', '').split(',') if x]
          s1 = [j for j in J['stage1'] + J.get('test', []) if (j['id'] in only) if only] or [j for j in J['stage1'] if not only]
          print('s1=' + json.dumps({'include': s1})); print('s2=' + json.dumps({'include': J['stage2']}))
          PY
        env: { ONLY: "${{ inputs.only }}" }
  stage1:
    needs: plan
    if: ${{ inputs.from_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy: { fail-fast: false, max-parallel: 20, matrix: "${{ fromJSON(needs.plan.outputs.s1) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: bash setup.sh
      - name: render
        run: |
          cd /home/claude/sp/ar1; mkdir -p /tmp/o; n=4; a=${{ matrix.a }}; b=${{ matrix.b }}; step=$(( (b-a+n-1)/n ))
          for k in $(seq 0 $((n-1))); do s=$((a+k*step)); e=$((s+step)); [ $e -gt $b ] && e=$b
            [ $s -lt $e ] && python3 render_job.py ${{ matrix.kind }} ${{ matrix.n }} $s $e /tmp/o/part$k.mp4 > /tmp/o/log$k.txt 2>&1 &
          done; wait
          ls /tmp/o; for k in $(seq 0 $((n-1))); do [ -f /tmp/o/part$k.mp4 ] && echo "file /tmp/o/part$k.mp4" >> /tmp/o/list.txt; done
          for k in $(seq 0 $((n-1))); do s=$((a+k*step)); [ $s -lt $b ] && [ ! -f /tmp/o/part$k.mp4.ok ] && { echo "::error::part $k failed: $(tail -c 600 /tmp/o/log$k.txt | tr '\n' ' ')"; exit 1; }; done
          ffmpeg -v error -f concat -safe 0 -i /tmp/o/list.txt -c copy /tmp/o/${{ matrix.id }}.mp4
          echo "::notice::${{ matrix.id }} ok $(ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of csv=p=0 /tmp/o/${{ matrix.id }}.mp4) frames"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.id }}", path: "/tmp/o/${{ matrix.id }}.mp4", retention-days: 5, compression-level: 0 }
  collect:
    needs: stage1
    if: ${{ always() && inputs.final == 'yes' && (needs.stage1.result == 'success' || inputs.from_run != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4          # (one call only lists 100 artifacts: split by name)
        with: { path: /tmp/a, pattern: "L*", merge-multiple: true, run-id: "${{ inputs.from_run || github.run_id }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { path: /tmp/a, pattern: "w?_*", merge-multiple: true, run-id: "${{ inputs.from_run || github.run_id }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { path: /tmp/a, pattern: "w??_*", merge-multiple: true, run-id: "${{ inputs.from_run || github.run_id }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: join blocks into loops and clips
        run: |
          mkdir -p /tmp/j; python3 - <<'PY'
          import json, subprocess, collections
          import os, sys
          J = json.load(open('jobs.json')); g = collections.defaultdict(list); want = collections.Counter()
          for j in J['stage1']: g[j['out']].append((j['a'], j['id'])); want[j['out']] += j['b'] - j['a']
          miss = [j['id'] for j in J['stage1'] if not os.path.exists(f"/tmp/a/{j['id']}.mp4")]
          print('downloaded', len(os.listdir('/tmp/a')), 'missing', miss)
          open('/tmp/j_report.txt', 'w').write(f"missing {miss}\n")
          if miss: print(f'::error::missing {len(miss)} blocks: {miss[:20]}'); sys.exit(1)
          for out, parts in g.items():
              open('/tmp/l.txt', 'w').write(''.join(f"file /tmp/a/{i}.mp4\n" for _, i in sorted(parts)))
              subprocess.run(['ffmpeg', '-v', 'error', '-y', '-f', 'concat', '-safe', '0', '-i', '/tmp/l.txt', '-c', 'copy', f'/tmp/j/{out}.mp4'], check=True)
              n = subprocess.run(['ffprobe', '-v', 'error', '-count_packets', '-select_streams', 'v', '-show_entries', 'stream=nb_read_packets', '-of', 'csv=p=0', f'/tmp/j/{out}.mp4'], capture_output=True, text=True).stdout.strip()
              if int(n) != want[out]: print(f'::error::{out} has {n} frames, expected {want[out]}'); sys.exit(1)
          print('::notice::all blocks joined')
          PY
      - uses: actions/upload-artifact@v4
        with: { name: "joined", path: "/tmp/j/*.mp4", retention-days: 5, compression-level: 0 }
  stage2:
    needs: [plan, collect]
    if: ${{ always() && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy: { fail-fast: false, max-parallel: 20, matrix: "${{ fromJSON(needs.plan.outputs.s2) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: bash setup.sh
      - uses: actions/download-artifact@v4
        with: { name: joined, path: /tmp/j }
      - name: final picture block
        run: |
          mkdir -p /home/claude/sp/ar1/loops /home/claude/sp/ar1/clips /tmp/o
          for f in /tmp/j/L*.mp4; do ln -sf $f /home/claude/sp/ar1/loops/; done; for f in /tmp/j/w*.mp4; do ln -sf $f /home/claude/sp/ar1/clips/; done
          cd /home/claude/sp/ar1; n=4; a=${{ matrix.a }}; b=${{ matrix.b }}; step=$(( (b-a+n-1)/n ))
          for k in $(seq 0 $((n-1))); do s=$((a+k*step)); e=$((s+step)); [ $e -gt $b ] && e=$b
            [ $s -lt $e ] && python3 assemble.py $s $e /tmp/o/part$k.mp4 > /tmp/o/log$k.txt 2>&1 &
          done; wait
          for k in $(seq 0 $((n-1))); do s=$((a+k*step)); [ $s -lt $b ] && { grep -q done /tmp/o/log$k.txt || { echo "::error::part $k failed: $(tail -c 600 /tmp/o/log$k.txt | tr '\n' ' ')"; exit 1; }; echo "file /tmp/o/part$k.mp4" >> /tmp/o/list.txt; }; done
          ffmpeg -v error -f concat -safe 0 -i /tmp/o/list.txt -c copy /tmp/o/${{ matrix.id }}.mp4
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.id }}", path: "/tmp/o/${{ matrix.id }}.mp4", retention-days: 5, compression-level: 0 }
  publish:
    needs: stage2
    if: ${{ always() && needs.stage2.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with: { path: /tmp/f, pattern: "F*", merge-multiple: true }
      - name: join and push to branch out
        run: |
          ls /tmp/f | sort > /tmp/names.txt; sed 's|^|file /tmp/f/|' /tmp/names.txt > /tmp/l.txt
          mkdir -p /tmp/out; ffmpeg -v error -f concat -safe 0 -i /tmp/l.txt -c copy /tmp/out/video.mp4
          cd /tmp/out; ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4 > info.txt; sha256sum video.mp4 > video.sha256
          split -b 90M video.mp4 video.part; rm video.mp4; ls -la >> info.txt
          cd $GITHUB_WORKSPACE && git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -q --orphan out && git rm -rqf --cached . && rm -rf media && mkdir media
          cp /tmp/out/info.txt /tmp/out/video.sha256 media/ && git add media && git commit -qm "out info" && git push -f origin out
          ls /tmp/out/video.part* | split -l 12 - /tmp/batch.                      # GitHub takes at most 2 GB per push
          for bf in /tmp/batch.*; do for f in $(cat $bf); do mv $f media/; done; git add media && git commit -qm "out $(basename $bf)" && git push origin out; done
          echo "::notice::published $(cat /tmp/out/info.txt | head -1)"
